<div class="pagamentos-panel">
  <p-card>
    <div class="title_card">
      <div class="header-card">
        <div class="title-container">
          <h3 class="titulo">Pagamentos do mês</h3>
        </div>
        <div class="opcoes-btn">
          <div class="menu_acoes">
            <p-menu #menu [model]="opcoesDeAcoes" [appendTo]="'body'" [popup]="true">
              <ng-template #item let-opcao>
                <ng-container *ngIf="opcao.route; else elseBlock">
                  <a class="p-menu-item-link" [routerLink]='[opcao.route]'>
                    <span [class]="opcao.icon"></span>
                    <span class="ml-2">{{ opcao.label }}</span>
                  </a>
                </ng-container>
                <ng-template #elseBlock>
                  <a [href]="opcao.url" class="p-menu-item-link">
                    <span [class]="opcao.icon"></span>
                    <span class="ml-2">{{ opcao.label }}</span>
                  </a>
                </ng-template>
              </ng-template>
            </p-menu>
            <p-button class="botao_acoes_lista" outlined="true" secondary (click)="abrirMenu($event)"
              icon="pi pi-ellipsis-v"></p-button>
          </div>
        </div>

      </div>
    </div>

    <div class="card-content">
      <p-table [value]="pagamentos" size="small" stripedRows
        selectionMode="single">
        <ng-template #header>
          <tr>
            <th style="width:20%" pSortableColumn="vencimento">Vencimento
              <p-sortIcon field="vencimento" />
            </th>
            <th style="width:25%" >Aluno</th>
            <th style="width:25%" >Contato</th>
            <th style="width:20%" pSortableColumn="situacao">Situação
              <p-sortIcon field="Situação" />
            </th >
            <th style="width:15%">Valor</th>
          </tr>
        </ng-template>
        <ng-template #body let-pagamento>
          <tr (click)="apresentarLiquidarPagamento(pagamento.id)">
            <td>
              <span class="font-medium">{{ pagamento.vencimento | dataBr}}</span>
            </td>
            <td>
              <div class="flex items-center gap-2">
                <span>{{ pagamento.aluno }}</span>
              </div>
            </td>
            <td>
              <div class="flex items-center gap-2">
                <span class="text-sm">{{ pagamento.responsavel_contrato }}</span>
              </div>
            </td>
            <td style="display: flex; justify-content: center;">
              <p-tag [value]="pagamento.situacao" [severity]="getSeverity(pagamento.situacao)" />
            </td>
            <td>
              <span class="font-semibold">{{pagamento.valor_original  | moeda }}</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </p-card>

</div>

<p-confirm-dialog></p-confirm-dialog>
<app-registrar-liquidacao (atualizarLista)="carregarLista()"></app-registrar-liquidacao>
