<p-card header="Detalhes do pagamento">
  <ng-template #title>
    Detalhes do pagamento
  </ng-template>

  <div class="cadastro_input ">
    <p-floatlabel variant="on">
      <input id="responsavel" readonly pInputText [(ngModel)]="pagamento.responsavel_contrato" required
        name="responsavel">
      <label for="responsavel">Responsável</label>
    </p-floatlabel>
  </div>
  <div class="cadastro_input ">
    <p-floatlabel variant="on">
      <input id="aluno" readonly pInputText [(ngModel)]="pagamento.aluno" required name="aluno">
      <label for="aluno">Aluno</label>
    </p-floatlabel>
  </div>
  <div class="cadastro_input ">
    <p-floatlabel variant="on">
      <input id="telefone" readonly pInputText [(ngModel)]="pagamento.telefone" required name="telefone">
      <label for="telefone">Telefone </label>
    </p-floatlabel>
  </div>
  <div class="cadastro_input ">
    <p-floatlabel variant="on">
      <input id="descricao" readonly pInputText [(ngModel)]="pagamento.descricao" required name="descricao">
      <label for="descricao">Descrição</label>
    </p-floatlabel>
  </div>

  <div class="cadastro_input">
    <p-floatlabel variant="on">
      <input id="situacao" readonly pInputText required [(ngModel)]="pagamento.situacao" name="situacao">
      <label for="situacao">Situação</label>
    </p-floatlabel>
  </div>

  <div class="cadastro_input">
    <p-floatlabel variant="on">
      <input id="valor" readonly pInputText [value]="pagamento.valor_total | moeda" required name="valor">
      <label for="valor">Valor total</label>
    </p-floatlabel>
  </div>

  <div class="cadastro_input">
    <p-floatlabel variant="on">
      <input id="data_vencimento" readonly pInputText [value]="pagamento.vencimento | date:'dd/MM/yyyy'"
        name="data_vencimento">
      <label for="data_vencimento">Data de vencimento</label>
    </p-floatlabel>
  </div>




  <div class="cadastro_input">
    <p-floatlabel variant="on">
      <input id="desconto" readonly pInputText required [(ngModel)]="pagamento.desconto" name="desconto">
      <label for="desconto">Desconto aplicado</label>
    </p-floatlabel>
  </div>


  <div class="cadastro_input">
    <p-floatlabel variant="on">
      <input id="valor_pago" readonly pInputText [value]="pagamento.valor_pago | moeda" required name="valor_pago">
      <label for="valor_pago">Valor pago</label>
    </p-floatlabel>
  </div>

  <div class="cadastro_input">
    <p-floatlabel variant="on">
      <input id="data_pagamento" readonly pInputText [value]="pagamento.data_pagamento | date:'dd/MM/yyyy'" required
        name="data_pagamento">
      <label for="data_pagamento">Data do pagamento</label>
    </p-floatlabel>
  </div>



  <div class="cadastro_botoes">
    <p-button label="Voltar" routerLink="/pagamentos" severity="secondary" class="w-full" [outlined]="true"
      styleClass="w-full" />
  </div>
</p-card>
