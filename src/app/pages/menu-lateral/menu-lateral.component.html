<div class="menu_lateral">
    <p-menu [model]="menu">
        <ng-template #item let-item>
            <a
                pRipple
                class="item_menu"
                [routerLink]="item.route">
                <span [class]="item.icon"></span>
                <span class="ml-2">
                    {{ item.label }}
                </span>

            </a>
        </ng-template>

    </p-menu>

</div>
